# Spring Boot Application
spring.application.name=support-ticket-system

# Database Configuration (PostgreSQL for production)
# Database credentials must be provided via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tickets}
spring.datasource.username=${DB_USERNAME:tickets_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# H2 Database Configuration (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
